[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-workflow"
version = "0.1.0a2"
description = "Give AI a bounded local workspace and require observable proof of work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "NS Lab contributors"}]
dependencies = ["mcp>=1.12,<2"]
keywords = ["ai-agents", "mcp", "workflow", "automation", "developer-tools", "reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nsw = "nsworkflow.cli:main"

[project.urls]
Homepage = "https://github.com/nslabhwan/ns-workflow"
Issues = "https://github.com/nslabhwan/ns-workflow/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
