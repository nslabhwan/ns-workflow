<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">NS Workflow verified execution demo</title>
  <desc id="desc">A terminal-style visual showing an AI workspace change moving from read to write to verification and durable verified completion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="1" stop-color="#151b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3ff"/>
      <stop offset="1" stop-color="#b18cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="690" rx="28" fill="#06080d"/>
  <rect x="42" y="42" width="1116" height="606" rx="24" fill="url(#bg)" stroke="#2b3347" filter="url(#shadow)"/>
  <circle cx="78" cy="78" r="7" fill="#ff6b6b"/>
  <circle cx="102" cy="78" r="7" fill="#ffd166"/>
  <circle cx="126" cy="78" r="7" fill="#65d88f"/>
  <text x="170" y="85" fill="#8f9bb3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">ns-workflow 0.1.0a2 · clean wheel</text>
  <rect x="74" y="119" width="1052" height="2" fill="url(#accent)" opacity="0.8"/>

  <text x="78" y="165" fill="#f6f8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">$ nsw demo</text>
  <text x="78" y="207" fill="#66e3ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">1 READ</text>
  <text x="215" y="207" fill="#d7deef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">status=broken</text>
  <text x="78" y="245" fill="#b18cff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">2 WRITE</text>
  <text x="215" y="245" fill="#d7deef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">before=e19e...  after=4f9c...</text>
  <text x="78" y="283" fill="#65d88f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">3 VERIFY</text>
  <text x="215" y="283" fill="#d7deef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">exit=0 · receipt saved</text>
  <text x="78" y="321" fill="#65d88f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700">4 RESULT</text>
  <text x="215" y="321" fill="#f6f8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700">PASS — observed, not self-reported</text>

  <rect x="74" y="360" width="1052" height="1" fill="#313a50"/>
  <text x="78" y="410" fill="#f6f8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">$ nsw flow demo</text>
  <text x="78" y="452" fill="#66e3ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">1 START</text>
  <text x="215" y="452" fill="#d7deef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">WAITING_APPROVAL</text>
  <text x="78" y="490" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">2 HUMAN</text>
  <text x="215" y="490" fill="#d7deef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">approve → resume durable run</text>
  <text x="78" y="528" fill="#65d88f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">3 VERIFY</text>
  <text x="215" y="528" fill="#d7deef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">real target re-read · exit=0</text>
  <text x="78" y="566" fill="#65d88f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700">4 OUTCOME</text>
  <text x="215" y="566" fill="#f6f8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700">VERIFIED_COMPLETE</text>

  <rect x="74" y="595" width="1052" height="1" fill="#313a50"/>
  <text x="78" y="624" fill="#8f9bb3" font-family="Inter, system-ui, sans-serif" font-size="18">AI does the work. NS Workflow makes the result prove itself.</text>
</svg>
