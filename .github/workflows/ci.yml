name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit and regression tests
        run: pytest
      - name: CLI doctor
        run: nsw doctor --workspace .
      - name: Zero-config proof
        run: nsw demo
      - name: Durable workflow E2E
        run: python tools/flow_e2e.py
      - name: MCP stdio E2E
        run: python tools/mcp_e2e.py
